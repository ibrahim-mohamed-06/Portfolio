<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>فرح المعلم إسلام كفتة</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Cairo', sans-serif;
      touch-action: manipulation;
    }
    
    /* أنوار ولمبات الفرح */
    .light-bulb {
      animation: blink 0.8s infinite alternate ease-in-out;
    }
    @keyframes blink {
      0% { opacity: 0.3; filter: drop-shadow(0 0 2px currentColor); transform: scale(0.9); }
      100% { opacity: 1; filter: drop-shadow(0 0 14px currentColor); transform: scale(1.1); }
    }

    /* رقصة صباع الكفتة */
    .dancing-kofta {
      animation: dance 0.6s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
      transform-origin: bottom center;
    }
    @keyframes dance {
      0% { transform: rotate(-8deg) scale(1) translateY(0); }
      50% { transform: rotate(0deg) scale(1.06) translateY(-14px); }
      100% { transform: rotate(8deg) scale(1) translateY(0); }
    }

    /* تصاعد دخان الشواية */
    .smoke-puff {
      animation: rise 2s infinite ease-out;
    }
    @keyframes rise {
      0% { opacity: 0.8; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(-70px) scale(2); }
    }

    /* زينة الفرح المثلثة */
    .bunting {
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    /* ليزر الفرح الخلفي */
    .laser-beam {
      position: absolute;
      width: 4px;
      height: 100vh;
      top: 0;
      opacity: 0.7;
      transform-origin: top center;
      animation: swing 2s infinite alternate ease-in-out;
      pointer-events: none;
    }
    @keyframes swing {
      0% { transform: rotate(-45deg); opacity: 0.3; }
      100% { transform: rotate(45deg); opacity: 0.8; }
    }
    
    /* حركة النقطة والفلوس */
    .money-fall {
      animation: fallDown 2.2s linear forwards;
    }
    @keyframes fallDown {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body class="bg-gradient-to-b from-[#11011e] via-[#1a0826] to-[#0a0012] text-white min-h-screen flex flex-col items-center justify-between overflow-x-hidden relative">

  <!-- كانفاس الألعاب النارية والكونفيتي والنقطة -->

  <!-- ليزرات الفرح في الخلفية -->

  <div class="laser-beam bg-green-400 shadow-[0_0_15px_#00ff66] left-1/2" style="animation-duration: 1.7s; animation-delay: 0.4s;"></div>
  <div class="laser-beam bg-cyan-400 shadow-[0_0_15px_#00ffff] left-3/4" style="animation-duration: 2.6s; animation-delay: 0.8s;"></div>

  <!-- زينة الفرح ولمبات النور المعلقة (Top) -->
  <header class="w-full relative z-30 pt-2 px-1">
    <!-- حبل النور -->
    <div class="flex justify-around items-center w-full px-2 mb-2">

      <div class="light-bulb w-4 h-4 rounded-full bg-blue-400 text-blue-400 shadow-lg" style="animation-delay: 0.6s;"></div>
      <div class="light-bulb w-4 h-4 rounded-full bg-pink-500 text-pink-500 shadow-lg" style="animation-delay: 0.3s;"></div>
      <div class="light-bulb w-4 h-4 rounded-full bg-purple-400 text-purple-400 shadow-lg" style="animation-delay: 0.7s;"></div>

  <!-- محتوى الفرح الرئيسي -->

    <!-- الاسم بخط ضخم ومشع "إسلام كفته" -->

        <svg width="220" height="220" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M76 75 Q100 81 124 75" stroke="#251006" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
            <path d="M77 100 Q100 106 123 100" stroke="#2B1408" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
            <path d="M78 125 Q100 131 122 125" stroke="#1F0D05" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
            
            <!-- لمعة الدهن والتحمير -->
            <path d="M82 38 Q88 80 84 135" stroke="#FDE047" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
            <!-- رشة بقدونس خضرا -->
            <circle cx="88" cy="62" r="2.5" fill="#22C55E"/>
            <circle cx="112" cy="88" r="2.5" fill="#16A34A"/>
            <circle cx="95" cy="115" r="3" fill="#4ADE80"/>
            <circle cx="106" cy="45" r="2" fill="#22C55E"/>
            <circle cx="85" cy="120" r="2" fill="#15803D"/>

            <rect x="103" y="65" width="22" height="15" rx="3" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
            <!-- جسر النظارة -->
            <line x1="97" y1="71" x2="103" y2="71" stroke="#F59E0B" stroke-width="2"/>
            <!-- لمعة عدسات النظارة -->
            <line x1="78" y1="68" x2="84" y2="76" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="106" y1="68" x2="112" y2="76" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
          </g>

          <!-- شنب المعلم الفخم -->
          <path d="M85 92 C92 90 98 94 100 96 C102 94 108 90 115 92 C118 96 111 100 100 99 C89 100 82 96 85 92 Z" fill="#000"/>

          <!-- تدرجات الألوان -->
          <defs>
            <linearGradient id="koftaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4A1E0B" />
              <stop offset="35%" stop-color="#78350F" />

        <!-- نص تشجيعي صغير -->

      <!-- زرار الزغروطة -->
      <button onclick="playZaghrouta()" class="flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-purple-600 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-[0_5px_15px_rgba(217,70,239,0.4)] border border-pink-300/30 text-sm sm:text-base transition-all">
        <span class="text-xl">💃</span>
        <span>زغروطة لأم إسلام</span>
      </button>

      <!-- زرار رمي النقطة -->
      <button onclick="throwMoney()" class="flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-[0_5px_15px_rgba(16,185,129,0.4)] border border-emerald-300/30 text-sm sm:text-base transition-all">
        <span class="text-xl">💸</span>
        <span>ارمِ نقطة للمعلم</span>
      </button>

      <!-- زرار الشماريخ والألعاب النارية -->
      <button onclick="launchFirework()" class="flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-orange-600 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-[0_5px_15px_rgba(245,158,11,0.4)] border border-amber-300/30 text-sm sm:text-base transition-all">
        <span class="text-xl">🎆</span>
        <span>ولّع شماريخ الفرح</span>
      </button>

  <!-- شريط المهرجان الأسفل الماركي الشغال -->
  <footer class="w-full bg-gradient-to-r from-yellow-500 via-red-600 to-purple-700 py-2.5 z-30 shadow-2xl overflow-hidden whitespace-nowrap border-t border-yellow-300">
    <div class="inline-block animate-[marquee_12s_linear_infinite] text-white font-black text-sm tracking-wide">
      🎉 ألف مبروك للمعلم الكبير إسلام كفته • أحلى مسا على كل الرجالة والجدعان اللي مشرفينا الليلة • وزع الكفتة يا جدع وسمّعني أحلى زغروطة • مبروك يا عريسنا 🎉
    </div>
  </footer>

  <style>
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>

  <!-- سكربت التفاعل والأصوات المدمجة والأنيميشن -->
  <script>
    /* ==============================================================
       1. محرك الصوت المدمج Web Audio API (بدون الحاجة لملفات خارجية)
       ============================================================== */
    let audioCtx = null;
    let isDjPlaying = false;
    let rhythmInterval = null;
    let currentBeat = 0;
    let totalCash = 0;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // صوت ضربة الطبلة الشعبية (الـ دم - Dum)
    function playDarbukaDum(time) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      const now = time || audioCtx.currentTime;
      osc.type = 'sine';
      // نزول سريع للتردد لإعطاء صدمة طبلة حقيقية
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.16);

      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    }

    // صوت نقرة الطبلة الحادة (الـ تك - Tak)
    function playDarbukaTak(time) {
      if (!audioCtx) return;
      const now = time || audioCtx.currentTime;

      // أوسيليتور لصوت رنين الألمنيوم/الفخار
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(650, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);

      gain.gain.setValueAtTime(0.7, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);
    }

    // صوت الشخاليل / الرق
    function playRiqq(time) {
      if (!audioCtx) return;
      const now = time || audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.05;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 5000;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(now);
    }

    // إيقاع المقسوم والبلدي الشعبي (Dum - Tak - - Tak - Dum - Tak -)
    function startShaabiBeat() {
      // سرعة الإيقاع الشعبي المصري (115 BPM)
      const stepTime = 130; // بالمللي ثانية
      currentBeat = 0;
      
      rhythmInterval = setInterval(() => {
        const beat = currentBeat % 8;
        // نمط المقسوم:
        // 0: Dum
        // 2: Tak
        // 3: Riqq
        // 5: Dum
        // 6: Tak
        // 7: Riqq
        if (beat === 0) {
          playDarbukaDum();
        } else if (beat === 2) {
          playDarbukaTak();
          playRiqq();
        } else if (beat === 3) {
          playRiqq();
        } else if (beat === 5) {
          playDarbukaDum();
        } else if (beat === 6) {
          playDarbukaTak();
          playRiqq();
        } else if (beat === 7) {
          playRiqq();
        }

        // جعل الكفتة تتراقص بقوة مع الضربة الكبيرة
        if (beat === 0 || beat === 5) {
          bumpKofta();
        }

        currentBeat++;
      }, stepTime);
    }

    function stopShaabiBeat() {
      clearInterval(rhythmInterval);
      rhythmInterval = null;
    }

    function toggleMusic() {
      initAudio();
      const btn = document.getElementById('djBtn');
      const text = document.getElementById('djText');
      const icon = document.getElementById('djIcon');

      if (!isDjPlaying) {
        startShaabiBeat();
        isDjPlaying = true;
        btn.classList.add('ring-4', 'ring-yellow-400', 'animate-pulse');
        text.innerText = "وقّف الإيقاع يا دي جي";
        icon.innerText = "🔊";
        createSparkles(15);
      } else {
        stopShaabiBeat();
        isDjPlaying = false;
        btn.classList.remove('ring-4', 'ring-yellow-400', 'animate-pulse');
        text.innerText = "شغّل مقسوم الفرح";
        icon.innerText = "🥁";
      }
    }

    // تخليق صوت الزغروطة المصرية بواسطة الـ FM Synthesis
    function playZaghrouta() {
      initAudio();
      bumpKofta(true);
      launchFirework();

      const now = audioCtx.currentTime;
      const duration = 2.4;

      // مذبذب النغمة الأساسية (صوت الحنجرة العالي)
      const carrier = audioCtx.createOscillator();
      carrier.type = 'sawtooth';
      carrier.frequency.setValueAtTime(1100, now);
      // تصاعد التردد أثناء الزغروطة
      carrier.frequency.linearRampToValueAtTime(1400, now + 1.2);
      carrier.frequency.exponentialRampToValueAtTime(900, now + duration);

      // مذبذب الاهتزاز السريع لحركة اللسان (LFO)
      const mod = audioCtx.createOscillator();
      mod.type = 'sine';
      mod.frequency.setValueAtTime(13.5, now); // 13.5 هزّة في الثانية للسان

      const modGain = audioCtx.createGain();
      modGain.gain.setValueAtTime(160, now);

      mod.connect(carrier.frequency);

      // فلتر لتنعيم الصوت وجعله نسائي
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1500, now);
      filter.Q.value = 2.5;

      const mainGain = audioCtx.createGain();
      mainGain.gain.setValueAtTime(0, now);
      mainGain.gain.linearRampToValueAtTime(0.4, now + 0.15);
      mainGain.gain.setValueAtTime(0.4, now + duration - 0.3);
      mainGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      carrier.connect(filter);
      filter.connect(mainGain);
      mainGain.connect(audioCtx.destination);

      mod.start(now);
      carrier.start(now);

      mod.stop(now + duration);
      carrier.stop(now + duration);
    }

    /* ==============================================================
       2. حركات صباع الكفتة وتفاعله
       ============================================================== */
    function pokeKofta() {
      initAudio();
      playDarbukaTak();
      bumpKofta(true);
      createSparkles(10);
      throwCashNote(window.innerWidth / 2, window.innerHeight / 2 - 50);
    }

    function bumpKofta(extra=false) {
      const kofta = document.getElementById('koftaElement');
      if (!kofta) return;
      const scale = extra ? 1.25 : 1.1;
      kofta.style.transform = `scale(${scale}) rotate(${extra ? (Math.random() > 0.5 ? 15 : -15) : 0}deg)`;
      setTimeout(() => {
        kofta.style.transform = '';
      }, 180);
    }

    /* ==============================================================
       3. رمي النقطة وتطاير الفلوس المصرية
       ============================================================== */
    function throwMoney() {
      initAudio();
      playDarbukaDum();
      
      // زيادة العداد
      const addAmounts = [100, 200, 500, 1000];
      const added = addAmounts[Math.floor(Math.random() * addAmounts.length)];
      totalCash += added;
      document.getElementById('moneyCounter').innerText = totalCash.toLocaleString('ar-EG') + ' ج.م';

      // رمي رزم فلوس في الشاشة
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          throwCashNote(Math.random() * (window.innerWidth - 80) + 40, -40);
        }, i * 90);
      }
    }

    function throwCashNote(x, y) {
      const bill = document.createElement('div');
      const bills = ['100 ج.م', '200 ج.م', '50 ج.م', '💸', '💵'];
      const chosen = bills[Math.floor(Math.random() * bills.length)];

      bill.className = 'fixed z-50 money-fall bg-gradient-to-r from-emerald-600 to-green-700 text-yellow-300 font-black text-xs px-3 py-1.5 rounded border border-yellow-300 shadow-xl pointer-events-none flex items-center gap-1';
      bill.innerHTML = `<span>🇪🇬</span><span>${chosen}</span>`;
      bill.style.left = `${x}px`;
      bill.style.top = `${y}px`;
      bill.style.transform = `rotate(${Math.random() * 60 - 30}deg)`;

      document.body.appendChild(bill);
      setTimeout(() => {
        bill.remove();
      }, 2300);
    }

    /* ==============================================================
       4. كانفاس الشماريخ، المفرقعات والكونفيتي
       ============================================================== */
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = Math.random() * 6 + 3;
        this.shape = Math.random() > 0.5 ? 'circle' : 'rect';
        this.rotation = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.12; // جاذبية
        this.alpha -= this.decay;
        this.rotation += 0.1;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        if (this.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 1.5);
        }
        ctx.restore();
      }
    }

    function createSparkles(count) {
      const colors = ['#F59E0B', '#EF4444', '#10B981', '#EC4899', '#3B82F6', '#FBBF24', '#FFFFFF'];
      const rect = document.getElementById('koftaElement').getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < count; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(cx, cy, color));
      }
    }

    function launchFirework() {
      initAudio();
      // صوت مفرقعات الشمروخ
      if (audioCtx) {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.38);
      }

      const colors = ['#EF4444', '#F59E0B', '#10B981', '#06B6D4', '#EC4899', '#A855F7', '#FDE047'];
      const x = Math.random() * (canvas.width * 0.7) + (canvas.width * 0.15);
      const y = Math.random() * (canvas.height * 0.4) + (canvas.height * 0.15);

      for (let i = 0; i < 75; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(x, y, color));
      }
    }

    // حلقة التحريك المستمرة للكانفاس
    function animateLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateLoop);
    }

    window.onload = function() {
      animateLoop();
      // مفرقعة ترحيبية لطيفة
      setTimeout(() => {
        launchFirework();
      }, 700);
    };
  </script>
